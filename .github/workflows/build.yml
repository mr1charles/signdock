name: Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', '**.md', '.github/workflows/renpy-player.yml', 'DockBox/renpy/**']   # page/readme edits don't cut a release

env:
  LIVECONTAINER_REF: 9108ae624ea001f7d7696d48407f890b48fa2653   # pinned upstream; apply.py asserts its anchors
  STIKDEBUG_REF: 97530a90392057783feef79709c3631b79d0eec7       # source of the prebuilt idevice FFI library
  ZSIGN_REF: c4ba9da4283031c07efa03bce42c4b8602d22e73            # full Zsign engine (bundle signing)
  ZIPFOUNDATION_REF: 0.9.20                                      # pure-Swift zip/unzip

jobs:
  importer-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test .deb, Ren'Py and itch.io importers
        run: |
          python3 DockBox/tests/make_fixtures.py fixtures
          swiftc -parse-as-library DockBox/overlay/sign/Importers.swift DockBox/tests/ImporterTests.swift -o importer-tests
          ./importer-tests fixtures

  dockbox:
    needs: [importer-tests]
    if: github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstreams
        run: |
          git clone https://github.com/LiveContainer/LiveContainer lc
          git -C lc checkout "$LIVECONTAINER_REF"
          git -C lc submodule update --init --recursive
          git clone https://github.com/StephenDev0/StikDebug stik
          git -C stik checkout "$STIKDEBUG_REF"
          git clone https://github.com/khcrysalis/Zsign-Package -b package zsign
          git -C zsign checkout "$ZSIGN_REF"
          git clone --depth 1 --branch "$ZIPFOUNDATION_REF" https://github.com/weichsel/ZIPFoundation zipf
      - name: Apply DockBox changes
        run: python3 DockBox/apply.py lc stik zsign zipf
      - name: Build Zsign engine
        run: DockBox/build_zsign.sh "$PWD/lc"
      - name: Archive
        working-directory: lc
        run: |
          set +e
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj \
            -sdk iphoneos -arch arm64 -configuration Release > build.log 2>&1
          code=$?
          echo "---- compiler errors ----"
          grep -E "error:|fatal error:|ld: " build.log | sort -u | head -80
          echo "---- xcodebuild exit $code ----"
          exit $code
      - name: Create IPA
        working-directory: lc
        env: { scheme: LiveContainer, archive_path: archive }
        run: |
          sh .github/build_github.sh
          mv LiveContainer.ipa ../DockBox.ipa
      - uses: actions/upload-artifact@v4
        with: { name: DockBox.ipa, path: DockBox.ipa }

  control:
    # Manual only: unmodified upstream at the pinned commit, built the same way. For telling "my change
    # broke installing" apart from "the installer/device has a problem".
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Fetch upstream
        run: |
          git clone https://github.com/LiveContainer/LiveContainer lc
          git -C lc checkout "$LIVECONTAINER_REF"
          git -C lc submodule update --init --recursive
      - name: Archive
        working-directory: lc
        run: |
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj \
            -sdk iphoneos -arch arm64 -configuration Release > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -40; exit 1; }
      - name: Create IPA
        working-directory: lc
        env: { scheme: LiveContainer, archive_path: archive }
        run: |
          sh .github/build_github.sh
          mv LiveContainer.ipa ../LiveContainer-control.ipa
      - uses: actions/upload-artifact@v4
        with: { name: LiveContainer-control.ipa, path: LiveContainer-control.ipa }

  release:
    needs: [dockbox]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4          # -> DockBox.ipa/DockBox.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" DockBox.ipa/DockBox.ipa \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "DockBox $TAG" --generate-notes --latest

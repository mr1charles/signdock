name: Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', '**.md']   # page/readme edits don't cut a release

env:
  LIVECONTAINER_REF: 9108ae624ea001f7d7696d48407f890b48fa2653   # pinned upstream; apply.py asserts its anchors
  STIKDEBUG_REF: 17b1e1d90d602a228de663a10efa987a9f9e547b       # source of the prebuilt idevice FFI library
  ZSIGN_REF: c4ba9da4283031c07efa03bce42c4b8602d22e73            # full Zsign engine (bundle signing)
  ZIPFOUNDATION_REF: 0.9.19                                      # pure-Swift zip/unzip

jobs:
  dockbox:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstreams
        run: |
          git clone https://github.com/LiveContainer/LiveContainer lc
          git -C lc checkout "$LIVECONTAINER_REF"
          git -C lc submodule update --init --recursive
          git clone https://github.com/StephenDev0/StikDebug stik
          git -C stik checkout "$STIKDEBUG_REF"
          git clone https://github.com/khcrysalis/Zsign-Package -b package zsign
          git -C zsign checkout "$ZSIGN_REF"
          git clone --depth 1 --branch "$ZIPFOUNDATION_REF" https://github.com/weichsel/ZIPFoundation zipf
      - name: Apply DockBox changes
        run: python3 DockBox/apply.py lc stik zsign zipf
      - name: Archive
        working-directory: lc
        run: |
          set +e
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj \
            -sdk iphoneos -arch arm64 -configuration Release > build.log 2>&1
          code=$?
          echo "---- compiler errors ----"
          grep -E "error:|fatal error:|ld: " build.log | sort -u | head -80
          echo "---- xcodebuild exit $code ----"
          exit $code
      - name: Create IPA
        working-directory: lc
        env: { scheme: LiveContainer, archive_path: archive }
        run: |
          sh .github/build_github.sh
          mv LiveContainer.ipa ../DockBox.ipa
      - uses: actions/upload-artifact@v4
        with: { name: DockBox.ipa, path: DockBox.ipa }

  release:
    needs: [dockbox]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4          # -> DockBox.ipa/DockBox.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" DockBox.ipa/DockBox.ipa \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "DockBox $TAG" --generate-notes --latest
